[package]
name = "wrf-formula"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Safe, unit-aware custom diagnostic expressions for WRF data"

[features]
default = ["pure-rust-reader"]
netcdf-backend = ["wrf-core/netcdf-backend"]
pure-rust-reader = ["wrf-core/pure-rust-reader"]

[dependencies]
wrf-core = { version = "0.1.0", path = "../wrf-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
