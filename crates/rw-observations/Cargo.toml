[package]
name = "rw-observations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Exact-time satellite, MRMS, NEXRAD, radar mosaic, and simulated-radar ingestion for Rusty Weather"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
grib-core = { path = "../../vendor/grib-core" }
rayon.workspace = true
rustwx-core = { path = "../rustwx-core" }
rustwx-io = { path = "../rustwx-io" }
rw-query = { path = "../rw-query" }
rw-store = { path = "../rw-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wx-radar = { path = "../../vendor/wx-radar" }

[dev-dependencies]
tempfile = "3"
