[package]
name = "rw-sat"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Continuous GOES ABI ingest: live S3 follow -> NetCDF decode -> rw-store rolling time-window frames"

[dependencies]
base64 = "0.22"
bzip2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rayon.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

# Pure-Rust NetCDF4/HDF5 reading: the vendored production stack from the old
# rustwx satellite pipeline. Use a repo-relative path so downstream git
# consumers (BowEcho) do not need machine-local root patches.
hdf5-reader = { path = "../../vendor/netcrust/vendor/hdf5-reader" }
netcrust = { path = "../../vendor/netcrust" }

rustwx-core = { path = "../rustwx-core" }
rw-ingest = { path = "../rw-ingest" }
rw-store = { path = "../rw-store" }

[[bin]]
name = "rw_sat"
path = "src/bin/rw_sat.rs"
