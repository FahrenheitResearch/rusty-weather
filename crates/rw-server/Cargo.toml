[package]
name = "rw-server"
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Hardened self-hosted HTTP service for Rusty Weather stores and analytics"

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros", "query", "tokio"] }
base64 = "0.22"
blake3 = "1.8.6"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { workspace = true, features = ["env"] }
http = "1.5.0"
ed25519-dalek = "2.2"
moka = { version = "0.12.16", features = ["future", "sync"] }
prometheus-client = "0.25.0"
quick-xml = { version = "0.41", features = ["serialize"] }
rw-community-protocol = { path = "../rw-community-protocol" }
rw-community-relay = { path = "../rw-community-relay" }
rw-federation-proxy = { path = "../rw-federation-proxy" }
rw-generation-replication = { path = "../rw-generation-replication" }
rw-ingest = { path = "../rw-ingest" }
rw-observations = { path = "../rw-observations" }
rw-nexrad-storm = { path = "../rw-nexrad-storm", features = ["openapi"] }
rw-ops-protocol = { path = "../rw-ops-protocol", features = ["openapi"] }
rw-query = { path = "../rw-query" }
rw-scheduler = { path = "../rw-scheduler" }
rw-sat = { path = "../rw-sat" }
rw-storm = { path = "../rw-storm" }
rw-storm-ml = { path = "../rw-storm-ml" }
rw-store = { path = "../rw-store" }
rustwx-core = { path = "../rustwx-core" }
rustwx-models = { path = "../rustwx-models" }
rustls.workspace = true
schemars = "1.2.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2.6.1"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8.23"
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-gzip", "cors", "fs", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
ureq.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
