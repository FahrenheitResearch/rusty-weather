[package]
name = "rw-odim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "EUMETNET OPERA ODIM_H5 polar-volume decoder (PVOL/SCAN): per-sweep VRAD/DBZH with classified undetect/nodata planes"

[dependencies]
# Pure-Rust, read-only HDF5 decode. Declared as a repo-relative path rather
# than `hdf5-reader = "0.3"` so that a downstream git consumer does not have to
# reproduce the workspace-root `[patch.crates-io]` pin -- the footgun the
# README documents and that `crates/rustwx-io` still relies on. Same choice,
# and same reason, as `crates/rw-glm`.
hdf5-reader = { path = "../../vendor/netcrust/vendor/hdf5-reader" }

chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# rw_odim: the thin ops CLI over the decoder. Lives in-crate (matching rw-glm's
# rw_glm_follow and rw-sat's rw_sat) so the decoder ships with a runnable front
# end and no extra crate.
[[bin]]
name = "rw_odim"
path = "src/bin/rw_odim.rs"
