<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>wxsection · plot lab</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0b0d0f; --panel: #14171a; --panel-2: #1b1f23; --line: #262b30;
    --ink: #e8edf1; --muted: #9aa4ad; --muted-2: #6f7982; --accent: #4ea1ff;
    --accent-ink: #04101f; --good: #46d38a; --bad: #ff6b6b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .tag { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header .hint { color: var(--muted-2); font-size: 12px; }
  .workspace { display: flex; gap: 14px; padding: 14px; align-items: flex-start; }
  .sidebar { width: 340px; flex: 0 0 340px; min-width: 0; display: flex;
    flex-direction: column; gap: 12px; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted); font-weight: 600; }
  label.field { display: block; margin: 0 0 10px; }
  label.field > span { display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 4px; }
  select, input[type=text], input[type=number] { width: 100%; background: var(--panel-2);
    color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: inherit; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { flex: 1 1 auto; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    font: inherit; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 9px; padding: 10px 14px; font: inherit; font-weight: 700;
    cursor: pointer; }
  .btn.secondary { background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; }
  #map { height: 260px; border-radius: var(--radius); border: 1px solid var(--line);
    overflow: hidden; }
  #map.drawing { cursor: crosshair; }
  .leaflet-control-attribution { font-size: 10px; }
  .viewer { background: #000; border: 1px solid var(--line); border-radius: var(--radius);
    min-height: 320px; display: flex; align-items: center; justify-content: center;
    overflow: auto; position: relative; }
  .viewer img { max-width: 100%; height: auto; display: block; }
  .viewer .placeholder { color: var(--muted-2); padding: 40px; text-align: center; }
  .status { display: flex; align-items: center; gap: 10px; min-height: 20px;
    font-size: 13px; color: var(--muted); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); }
  .status.busy .dot { background: var(--accent); animation: pulse 1s infinite; }
  .status.ok .dot { background: var(--good); }
  .status.err { color: var(--bad); } .status.err .dot { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .logo-preview { margin-top: 8px; display: none; align-items: center; gap: 8px; }
  .logo-preview img { height: 30px; background: #fff; border-radius: 4px; padding: 2px; }
  .logo-preview button { background: none; border: 0; color: var(--bad); cursor: pointer; }
  .muted { color: var(--muted-2); font-size: 12px; }
  .bounds { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 11px;
    color: var(--muted); }
  @media (max-width: 820px) {
    .workspace { flex-direction: column; padding: 10px; }
    .sidebar { width: 100%; flex: 1 1 auto; order: 2; }
    .stage { order: 1; width: 100%; }
    #map { height: 200px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">wxsection</span>
    <span class="tag">plot lab · generic</span>
    <span class="spacer"></span>
    <span class="hint">arbitrary weather maps · HRRR · GFS · NBM</span>
  </header>

  <div class="workspace">
    <div class="sidebar">
      <div class="card">
        <h2>Model &amp; product</h2>
        <label class="field"><span>Model</span>
          <div class="seg" id="modelSeg">
            <button data-model="hrrr" class="on">HRRR</button>
            <button data-model="gfs">GFS</button>
            <button data-model="nbm">NBM</button>
          </div>
        </label>
        <label class="field"><span>Product</span>
          <select id="product"></select>
        </label>
        <label class="field"><span>Forecast hour: <b id="hourLabel">6</b></span>
          <div class="row">
            <button class="btn secondary" id="hourPrev" style="flex:0 0 auto">◀</button>
            <input type="range" id="hour" min="0" max="48" step="1" value="6" style="flex:1" />
            <button class="btn secondary" id="hourNext" style="flex:0 0 auto">▶</button>
          </div>
        </label>
      </div>

      <div class="card">
        <h2>Domain</h2>
        <div class="seg" id="domainSeg" style="margin-bottom:10px"></div>
        <div id="map"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn secondary" id="drawBtn" style="flex:1">✎ draw box</button>
          <button class="btn secondary" id="drawClear" style="flex:0 0 auto">reset</button>
        </div>
        <div class="bounds" id="boundsLabel" style="margin-top:6px"></div>
      </div>

      <div class="card">
        <h2>Style</h2>
        <label class="field"><span>Basemap</span>
          <div class="seg" id="basemapSeg">
            <button data-basemap="topo" class="on">Topo</button>
            <button data-basemap="filled">Filled</button>
            <button data-basemap="white">White</button>
          </div>
        </label>
        <label class="field"><span>City labels</span>
          <div class="seg" id="valueSeg">
            <button data-values="off" class="on">Names</button>
            <button data-values="on">Values</button>
          </div>
        </label>
        <div class="row">
          <label class="field" style="flex:1"><span>Label density</span>
            <div class="seg" id="densitySeg">
              <button data-density="1">Low</button>
              <button data-density="2" class="on">Med</button>
              <button data-density="3">Dense</button>
              <button data-density="4">Max</button>
            </div>
          </label>
        </div>
        <label class="field" style="margin:0"><span>Counties</span>
          <div class="seg" id="countySeg">
            <button data-county="on" class="on">On</button>
            <button data-county="off">Off</button>
          </div>
        </label>
      </div>

      <div class="card">
        <h2>Branding</h2>
        <label class="field"><span>Brand</span>
          <div class="seg" id="brandSeg">
            <button data-brand="generic" class="on">Generic</button>
            <button data-brand="custom">Custom</button>
            <button data-brand="none">None</button>
          </div>
        </label>
        <div id="customBrand" style="display:none">
          <label class="field"><span>Title (left)</span>
            <input type="text" id="brandTitle" placeholder="e.g. ACME FIRE OPS" maxlength="80" />
          </label>
          <label class="field"><span>Credit (right)</span>
            <input type="text" id="brandCredit" placeholder="e.g. acme.example.com" maxlength="80" />
          </label>
          <label class="field" style="margin:0"><span>Logo (PNG, optional)</span>
            <input type="file" id="brandLogo" accept="image/*" />
          </label>
          <div class="logo-preview" id="logoPreview">
            <img id="logoImg" alt="logo" /><button id="logoClear">remove</button>
          </div>
        </div>
        <p class="muted" id="brandHelp" style="margin:8px 0 0">Generic: small
          <code>wxsection.com</code> credit, no title.</p>
      </div>

      <button class="btn" id="renderBtn">Render plot</button>
    </div>

    <div class="stage">
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Ready.</span></div>
      <div class="viewer" id="viewer">
        <div class="placeholder">Pick a product and hit <b>Render plot</b>.<br />
          The min/max readout and branding are baked into the image.</div>
      </div>
      <div class="row">
        <a class="btn secondary" id="downloadBtn" style="pointer-events:none;opacity:.5">Download</a>
        <button class="btn secondary" id="copyLink">Copy share link</button>
        <span class="muted" id="renderMeta"></span>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  "use strict";
  var API = ""; // same origin

  // ---- product catalog (curated, known-good slugs per model) ----------------
  var WEATHER = [
    ["2m_temperature_10m_winds", "Temperature + wind"],
    ["2m_dewpoint_10m_winds", "Dewpoint + wind"],
    ["2m_relative_humidity_10m_winds", "RH + wind"],
    ["10m_wind_gusts", "Wind gusts"],
    ["visibility", "Visibility"],
  ];
  var PRODUCTS = {
    hrrr: WEATHER,
    gfs: WEATHER.filter(function (p) { return p[0] !== "visibility"; }),
    nbm: WEATHER,
  };
  var HOUR_LIMITS = { hrrr: { max: 48, step: 1 }, gfs: { max: 384, step: 6 }, nbm: { max: 264, step: 6 } };

  var DOMAINS = [
    ["conus", "CONUS", [-125, -66.5, 24, 50]],
    ["california", "California", [-126, -113.8, 31.9, 42.5]],
    ["pacnw", "Pacific NW", [-125, -110, 41, 49.5]],
    ["southwest", "Southwest", [-120, -102, 30, 42]],
    ["norockies", "N. Rockies", [-117, -103, 42, 49.5]],
    ["plains", "Great Plains", [-105, -90, 32, 49]],
    ["southeast", "Southeast", [-95, -75, 24.5, 37]],
    ["northeast", "Northeast", [-82, -66.5, 37, 47.5]],
  ];

  var state = {
    model: "hrrr", product: WEATHER[0][0], hour: 6,
    basemap: "topo", values: false, density: 2, counties: true,
    preset: "conus", bounds: DOMAINS[0][2], drawn: null,
    brand: "generic", brandTitle: "", brandCredit: "", logoDataUrl: null,
  };

  var $ = function (id) { return document.getElementById(id); };

  // ---- segmented-control helper --------------------------------------------
  function seg(id, attr, cb) {
    var el = $(id);
    el.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-" + attr + "]"); if (!b) return;
      [].forEach.call(el.querySelectorAll("button"), function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      cb(b.getAttribute("data-" + attr));
    });
  }

  function fillProducts() {
    var sel = $("product"); sel.innerHTML = "";
    PRODUCTS[state.model].forEach(function (p) {
      var o = document.createElement("option"); o.value = p[0]; o.textContent = p[1]; sel.appendChild(o);
    });
    if (!PRODUCTS[state.model].some(function (p) { return p[0] === state.product; })) {
      state.product = PRODUCTS[state.model][0][0];
    }
    sel.value = state.product;
  }

  function applyHourLimits() {
    var lim = HOUR_LIMITS[state.model];
    var h = $("hour"); h.max = lim.max; h.step = lim.step;
    if (state.hour > lim.max) state.hour = lim.max;
    state.hour = Math.round(state.hour / lim.step) * lim.step;
    h.value = state.hour; $("hourLabel").textContent = state.hour;
  }

  function boundsLabel() {
    var b = activeBounds();
    $("boundsLabel").textContent = "W " + b[0].toFixed(2) + "  E " + b[1].toFixed(2) +
      "  S " + b[2].toFixed(2) + "  N " + b[3].toFixed(2) + (state.drawn ? "  (drawn)" : "");
  }
  function activeBounds() { return state.drawn || state.bounds; }

  // ---- wiring ---------------------------------------------------------------
  DOMAINS.forEach(function (d, i) {
    var b = document.createElement("button"); b.textContent = d[1]; b.setAttribute("data-domain", d[0]);
    if (i === 0) b.classList.add("on"); $("domainSeg").appendChild(b);
  });

  seg("modelSeg", "model", function (v) { state.model = v; fillProducts(); applyHourLimits(); });
  $("product").addEventListener("change", function (e) { state.product = e.target.value; });
  $("hour").addEventListener("input", function (e) { state.hour = Number(e.target.value); $("hourLabel").textContent = state.hour; });
  $("hourPrev").addEventListener("click", function () { stepHour(-1); });
  $("hourNext").addEventListener("click", function () { stepHour(1); });
  function stepHour(dir) { var lim = HOUR_LIMITS[state.model];
    state.hour = Math.min(lim.max, Math.max(0, state.hour + dir * lim.step));
    $("hour").value = state.hour; $("hourLabel").textContent = state.hour; }

  seg("domainSeg", "domain", function (v) {
    var d = DOMAINS.find(function (x) { return x[0] === v; });
    state.preset = v; state.bounds = d[2]; state.drawn = null; syncMapToBounds(); boundsLabel();
  });
  seg("basemapSeg", "basemap", function (v) { state.basemap = v; });
  seg("valueSeg", "values", function (v) { state.values = v === "on"; });
  seg("densitySeg", "density", function (v) { state.density = Number(v); });
  seg("countySeg", "county", function (v) { state.counties = v === "on"; });

  seg("brandSeg", "brand", function (v) {
    state.brand = v;
    $("customBrand").style.display = v === "custom" ? "block" : "none";
    var help = { generic: "Generic: small <code>wxsection.com</code> credit, no title.",
      custom: "Custom: your title, credit, and optional logo in the banner strip.",
      none: "None: blank banner strip (still croppable)." };
    $("brandHelp").innerHTML = help[v];
  });
  $("brandTitle").addEventListener("input", function (e) { state.brandTitle = e.target.value; });
  $("brandCredit").addEventListener("input", function (e) { state.brandCredit = e.target.value; });

  // ---- logo upload -> downscaled PNG dataURL --------------------------------
  $("brandLogo").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 400, scale = Math.min(1, maxW / img.width);
        var cw = Math.max(1, Math.round(img.width * scale)), ch = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement("canvas"); c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        state.logoDataUrl = c.toDataURL("image/png");
        $("logoImg").src = state.logoDataUrl; $("logoPreview").style.display = "flex";
      };
      img.onerror = function () { setStatus("err", "Could not read that image."); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  $("logoClear").addEventListener("click", function () {
    state.logoDataUrl = null; $("brandLogo").value = ""; $("logoPreview").style.display = "none";
  });

  // ---- Leaflet map + draw ---------------------------------------------------
  var map = null, rectLayer = null, drawing = false, drawStart = null, tempRect = null;
  function initMap() {
    if (!window.L) { $("drawBtn").disabled = true; return; }
    map = L.map("map", { zoomControl: true, scrollWheelZoom: false }).setView([39, -96], 4);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      { attribution: "© OSM © CARTO", maxZoom: 12 }).addTo(map);
    syncMapToBounds();
    var el = map.getContainer();
    el.addEventListener("pointerdown", function (ev) {
      if (!drawing) return; ev.preventDefault();
      drawStart = map.mouseEventToLatLng(ev);
      if (tempRect) { map.removeLayer(tempRect); tempRect = null; }
    });
    el.addEventListener("pointermove", function (ev) {
      if (!drawing || !drawStart) return;
      var p = map.mouseEventToLatLng(ev);
      var b = L.latLngBounds(drawStart, p);
      if (tempRect) tempRect.setBounds(b);
      else tempRect = L.rectangle(b, { color: "#4ea1ff", weight: 2, fillOpacity: 0.08 }).addTo(map);
    });
    el.addEventListener("pointerup", function (ev) {
      if (!drawing || !drawStart) return;
      var p = map.mouseEventToLatLng(ev);
      finishDraw(L.latLngBounds(drawStart, p)); drawStart = null;
    });
    window.addEventListener("resize", function () { setTimeout(function () { map.invalidateSize(); }, 50); });
    setTimeout(function () { map.invalidateSize(); }, 200);
  }
  function syncMapToBounds() {
    if (!map) return;
    var b = activeBounds();
    if (rectLayer) { map.removeLayer(rectLayer); rectLayer = null; }
    var llb = L.latLngBounds([b[2], b[0]], [b[3], b[1]]);
    rectLayer = L.rectangle(llb, { color: "#8aa", weight: 1, dashArray: "4", fillOpacity: 0 }).addTo(map);
    map.fitBounds(llb, { padding: [10, 10] });
  }
  function finishDraw(llb) {
    drawing = false; $("map").classList.remove("drawing"); $("drawBtn").classList.remove("on");
    map.dragging.enable();
    if (tempRect) { map.removeLayer(tempRect); tempRect = null; }
    var sw = llb.getSouthWest(), ne = llb.getNorthEast();
    state.drawn = [sw.lng, ne.lng, sw.lat, ne.lat]; state.preset = "drawn";
    [].forEach.call($("domainSeg").querySelectorAll("button"), function (x) { x.classList.remove("on"); });
    syncMapToBounds(); boundsLabel();
  }
  $("drawBtn").addEventListener("click", function () {
    if (!map) return;
    drawing = !drawing; this.classList.toggle("on", drawing);
    $("map").classList.toggle("drawing", drawing);
    if (drawing) map.dragging.disable(); else map.dragging.enable();
  });
  $("drawClear").addEventListener("click", function () {
    state.drawn = null; state.preset = "conus"; state.bounds = DOMAINS[0][2];
    [].forEach.call($("domainSeg").querySelectorAll("button"), function (x, i) { x.classList.toggle("on", i === 0); });
    syncMapToBounds(); boundsLabel();
  });

  // ---- status ---------------------------------------------------------------
  function setStatus(kind, text) {
    var s = $("status"); s.className = "status" + (kind ? " " + kind : "");
    $("statusText").textContent = text;
  }

  // ---- payload + render -----------------------------------------------------
  function brandPayload() {
    if (state.brand === "generic") return { preset: "generic" };
    if (state.brand === "none") return { preset: "none" };
    var b = { preset: "custom" };
    if (state.brandTitle.trim()) b.title = state.brandTitle.trim();
    if (state.brandCredit.trim()) b.credit = state.brandCredit.trim();
    if (state.logoDataUrl) b.logo_b64 = state.logoDataUrl;
    return b;
  }
  function buildPayload() {
    return {
      model: state.model, run: "latest", hour: state.hour, products: state.product,
      output_format: "webp", plot_style: "operational", basemap_style: state.basemap,
      county_linework: state.counties, place_label_density: state.density,
      place_label_size: 2, output_width: 1800, value_labels: state.values,
      domain_slug: "generic_" + (state.drawn ? "drawn" : state.preset),
      bounds: activeBounds(), brand: brandPayload(),
    };
  }

  var busy = false;
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var POLL = [150, 250, 400, 600, 800, 1000, 1000, 1500, 2000];

  async function render() {
    if (busy) return; busy = true; $("renderBtn").disabled = true;
    setStatus("busy", "Rendering…");
    $("renderMeta").textContent = ""; var t0 = performance.now();
    try {
      var payload = buildPayload();
      var started = await fetch(API + "/api/render", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
      var startedJson = await started.json();
      if (!started.ok || !startedJson.status_url) {
        throw new Error(startedJson.error || ("render request failed (" + started.status + ")"));
      }
      var statusUrl = API + startedJson.status_url;
      var job = null;
      for (var i = 0; ; i++) {
        await sleep(POLL[Math.min(i, POLL.length - 1)]);
        var jr = await fetch(statusUrl); job = await jr.json();
        if (job.state === "succeeded") break;
        if (job.state === "failed") throw new Error(job.message || "render failed");
        if (i > 120) throw new Error("timed out waiting for render");
      }
      var file = job.files && job.files[0];
      if (!file || !file.url) throw new Error("render produced no image");
      var url = API + file.url;
      showImage(url, file.name);
      var secs = ((performance.now() - t0) / 1000).toFixed(1);
      setStatus("ok", "Done in " + secs + "s" + (startedJson.cache === "hit" ? " (cached)" : ""));
      $("renderMeta").textContent = job.wall_ms ? ("server " + job.wall_ms + " ms") : "";
    } catch (err) {
      setStatus("err", String(err.message || err));
    } finally { busy = false; $("renderBtn").disabled = false; }
  }

  function showImage(url, name) {
    var v = $("viewer"); v.innerHTML = "";
    var img = new Image(); img.src = url; img.alt = name || "plot"; v.appendChild(img);
    var dl = $("downloadBtn"); dl.href = url; dl.setAttribute("download", name || "wxsection.webp");
    dl.style.pointerEvents = "auto"; dl.style.opacity = "1";
  }

  $("renderBtn").addEventListener("click", render);
  $("copyLink").addEventListener("click", function () {
    var qs = new URLSearchParams({ model: state.model, product: state.product, hour: state.hour,
      domain: state.drawn ? state.drawn.join(",") : state.preset, brand: state.brand }).toString();
    var link = location.origin + location.pathname + "?" + qs;
    navigator.clipboard && navigator.clipboard.writeText(link);
    setStatus("ok", "Share link copied.");
  });

  // ---- deep link ------------------------------------------------------------
  function applyDeepLink() {
    var qs = new URLSearchParams(location.search);
    if (qs.get("model") && PRODUCTS[qs.get("model")]) {
      state.model = qs.get("model");
      [].forEach.call($("modelSeg").querySelectorAll("button"), function (b) {
        b.classList.toggle("on", b.getAttribute("data-model") === state.model); });
    }
    fillProducts();
    if (qs.get("product")) { state.product = qs.get("product"); $("product").value = state.product; }
    if (qs.get("hour")) state.hour = Number(qs.get("hour"));
    applyHourLimits();
    var dom = qs.get("domain");
    if (dom && dom.indexOf(",") > -1) { state.drawn = dom.split(",").map(Number); state.preset = "drawn";
      [].forEach.call($("domainSeg").querySelectorAll("button"), function (x) { x.classList.remove("on"); });
    } else if (dom) { var d = DOMAINS.find(function (x) { return x[0] === dom; });
      if (d) { state.preset = dom; state.bounds = d[2];
        [].forEach.call($("domainSeg").querySelectorAll("button"), function (x) {
          x.classList.toggle("on", x.getAttribute("data-domain") === dom); }); } }
    if (qs.get("brand")) { state.brand = qs.get("brand");
      [].forEach.call($("brandSeg").querySelectorAll("button"), function (b) {
        b.classList.toggle("on", b.getAttribute("data-brand") === state.brand); });
      $("customBrand").style.display = state.brand === "custom" ? "block" : "none"; }
  }

  // ---- boot -----------------------------------------------------------------
  fillProducts(); applyHourLimits(); applyDeepLink();
  initMap(); boundsLabel();
})();
</script>
</body>
</html>
