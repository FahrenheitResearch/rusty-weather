[package]
name = "rw-formula"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version.workspace = true
description = "Rusty Weather bridge for safe wrf-formula diagnostics"

[dependencies]
rw-store = { path = "../rw-store" }
rustwx-core = { path = "../rustwx-core" }
thiserror = "2"
wrf-core = { git = "https://github.com/FahrenheitResearch/wrf-rust.git", rev = "96b8fd9d29c3477474da18f1277971bb89a61a9c", package = "wrf-core", default-features = false, features = ["pure-rust-reader"] }
wrf-formula = { git = "https://github.com/FahrenheitResearch/wrf-rust.git", rev = "96b8fd9d29c3477474da18f1277971bb89a61a9c", package = "wrf-formula", default-features = false, features = ["pure-rust-reader"] }
