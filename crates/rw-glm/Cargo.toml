[package]
name = "rw-glm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rw-store = { path = "../rw-store" }

# Anonymous S3 listing/download for the follow engine (Task 3), mirroring
# rw-sat: ureq over rustls with its portable ring provider (no SDK or credentials).
rustls.workspace = true
ureq.workspace = true

# Pure-Rust NetCDF4/HDF5 reading for GLM L2 LCFA granule decode (Task 2),
# mirroring rw-sat. Use a repo-relative path so downstream git consumers do
# not need machine-local root patches.
hdf5-reader = { path = "../../vendor/netcrust/vendor/hdf5-reader" }
netcrust = { path = "../../vendor/netcrust" }

# rw_glm_follow: the thin ops CLI over follow_live + the reader/validator.
# Lives in-crate (matching rw-sat's rw_sat bin) so the follow engine ships
# with a runnable front end and no extra crate.
[[bin]]
name = "rw_glm_follow"
path = "src/bin/rw_glm_follow.rs"
