[package]
name = "rw-community-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Relay-only security and control-plane core for BowEcho Community Cache"
readme = "README.md"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
ed25519-dalek = "2.2"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rw-community-protocol = { path = "../rw-community-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["net", "rt", "sync", "time", "test-util"] }
turn = "=0.17.2"
webrtc-util = { version = "=0.17.1", default-features = false, features = ["conn"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
rand_chacha = "0.3"
