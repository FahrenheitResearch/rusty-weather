[package]
name = "rw-nexrad-storm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Strict, transport-neutral decoder for authoritative NEXRAD Level III storm products"

[features]
default = []
openapi = ["dep:utoipa"]

[dependencies]
bzip2 = "0.5"
