# RW_* environment variables override this file. --config or RW_CONFIG selects it.

[server]
listen = "127.0.0.1:8788"
store_root = "./store"
artifact_root = "./artifacts"
allow_unauthenticated_public_bind = false
cors_origins = []

[auth]
# Prefer RW_API_TOKEN_FILE in production. The file contains one token per line
# and must be readable only by the service account.
# token_file = "/etc/rusty-weather/api-tokens.txt"
protect_metrics = true

[limits]
request_body_bytes = 2097152
variables_per_query = 32
points_per_query = 100
sync_result_values = 2000000
json_grid_values = 250000
# Async temporal jobs use independent budgets. These defaults cover HRRR's
# 1799x1059 native domain, including the 13-value vector-summary result.
temporal_reduction_cells = 4000000
temporal_output_values = 32000000
catalog_time_points = 10000
temporal_frames = 120
light_concurrency = 32
heavy_concurrency = 2
queued_jobs = 64
job_history_records = 10000
sync_timeout_seconds = 10
job_timeout_seconds = 300
job_retention_seconds = 604800
job_result_bytes = 536870912
reader_cache_bytes = 268435456
response_cache_bytes = 134217728

[catalog]
response_cache_seconds = 300

# Community Cache is a phase-one, server-mediated immutable-object cache. It
# is fully disabled by default and contains no direct peer-connectivity code.
[community]
enabled = false
# This example is intentionally not production-approved. Set true only after
# the target origin host's disk/concurrency audit supplies every quota below.
capacity_audit_completed = false
kill_switch = false
root = "./community-cache"
# signing_key_file = "/etc/rusty-weather/community-ed25519.key"
trusted_public_keys = []
# origin_base_url = "https://weather.example.com"
# origin_token_file = "/etc/rusty-weather/community-origin-token"

[community.hot_store]
provider = "disabled"
# R2-compatible gateway example (credentials are read from token_file):
# provider = "r2"
# base_url = "https://objects.example.com"
# bucket = "rusty-weather-hot"
# token_file = "/etc/rusty-weather/r2-gateway-token"

[community.promotion]
enabled = false
minimum_hits = 3
window_seconds = 300
maximum_object_bytes = 67108864

# Non-production parsing examples only; they are not chosen capacity values.
# Enabling Community Cache requires replacing them with audited values and
# setting capacity_audit_completed = true.
[community.quotas]
maximum_object_bytes = 67108864
maximum_decompressed_bytes = 268435456
maximum_manifest_bytes = 262144
storage_bytes = 10737418240
upload_bytes_per_month = 107374182400
download_bytes_per_month = 107374182400
# Global hot-provider promotion cost ceiling. Crossing it pauses promotion;
# normal local-cache and HTTPS-origin fallback remain available.
promoted_bytes_per_month = 107374182400
concurrent_transfers = 4
maximum_principals = 10000
maximum_objects = 100000

[community.cases]
enabled = false
maximum_manifest_bytes = 262144
maximum_objects_per_case = 512
maximum_cases = 1000
storage_bytes = 268435456
default_retention_seconds = 2592000

[logging]
filter = "rw_server=info,tower_http=info"
format = "json"
