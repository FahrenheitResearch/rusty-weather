# Install only as an explicitly reviewed drop-in at:
# /etc/systemd/system/rusty-weather.service.d/50-satellite-ingest.conf
#
# Server-owned satellite follow atomically writes native NOAA ABI sources and
# compact previews to the operational store. Configuration remains default-off;
# this filesystem permission alone does not enable network ingest.
[Service]
ReadOnlyPaths=
ReadWritePaths=/var/lib/rusty-weather/store
ReadWritePaths=/var/lib/rusty-weather/satellite-staging
