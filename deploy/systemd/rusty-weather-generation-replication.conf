# Install only as an explicitly reviewed drop-in at:
# /etc/systemd/system/rusty-weather.service.d/50-generation-replication.conf
#
# Full-generation replication atomically installs validated .rws generations,
# so this advanced mode is the sole API deployment allowed to write the model
# store. The feature remains separately default-off and kill-switched in Rusty
# Weather configuration; this filesystem permission does not enable it.
[Service]
ReadOnlyPaths=
ReadWritePaths=/var/lib/rusty-weather/store
ReadWritePaths=/var/lib/rusty-weather/generation-replication
