# Install only as an explicitly reviewed drop-in at:
# /etc/systemd/system/rusty-weather.service.d/50-mrms-ingest.conf
#
# Continuous MRMS ingest atomically writes exact-time NOAA products to the
# operational store. Configuration and authenticated status/control routes
# remain default-off; this filesystem permission alone enables no network work.
[Service]
ReadOnlyPaths=
ReadWritePaths=/var/lib/rusty-weather/store
