name: Port observations onto cf0ca369 v2

on:
  pull_request:
    branches: [codex/windows-fetch-lock-fix-20260814]
    paths:
      - '.github/workflows/port-observations-cf0ca369-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-observations-cf0ca369-v2
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  port-build-test-commit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: feat/rw-server-observations-satellite-final
          fetch-depth: 0
          persist-credentials: true

      - name: Verify requested base and install toolchain
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cf0ca3693650153ff0f79a0e60c3ec2da7d0af01 HEAD
          test "$(git merge-base cf0ca3693650153ff0f79a0e60c3ec2da7d0af01 HEAD)" = cf0ca3693650153ff0f79a0e60c3ec2da7d0af01
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgl1-mesa-dev libwayland-dev libx11-dev libxi-dev libxkbcommon-dev
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Apply implementation and resolve newer API seams
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/observations.patch.b64"
          for part in $(seq -w 0 10); do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/FahrenheitResearch/rusty-weather/feat/unified-observations-rw-server/.github/bootstrap/unified-observations.patch.part-${part}" \
              >> "$RUNNER_TEMP/observations.patch.b64"
          done
          base64 --decode "$RUNNER_TEMP/observations.patch.b64" \
            | gzip --decompress > "$RUNNER_TEMP/observations.patch"

          set +e
          git apply --reject --whitespace=fix "$RUNNER_TEMP/observations.patch"
          apply_status=$?
          set -e
          echo "partial patch exit status: $apply_status"

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          rejects = set(root.rglob('*.rej'))
          expected = {
              Path('Cargo.toml.rej'),
              Path('crates/rw-query/src/lib.rs.rej'),
              Path('crates/rw-server/src/lib.rs.rej'),
              Path('crates/rw-server/src/routes.rs.rej'),
          }
          if rejects != expected:
              raise SystemExit(
                  f'rejected hunk set changed: got {sorted(map(str, rejects))}, '
                  f'expected {sorted(map(str, expected))}'
              )

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          text = read('Cargo.toml')
          entry = '    "crates/rw-observations",\n'
          if entry not in text:
              anchor = '    "crates/rw-query",\n'
              if anchor not in text:
                  raise SystemExit('workspace anchor disappeared')
              text = text.replace(anchor, anchor + entry, 1)
              write('Cargo.toml', text)

          text = read('crates/rw-query/src/lib.rs')
          old = 'pub use time::parse_legacy_run_origin_unix;'
          new = (
              'pub use time::{\n'
              '    parse_legacy_observation_day_origin_unix, '
              'parse_legacy_observation_hhmm_slot,\n'
              '    parse_legacy_run_origin_unix,\n'
              '};'
          )
          if new not in text:
              if old not in text:
                  raise SystemExit('rw-query export anchor disappeared')
              text = text.replace(old, new, 1)
              write('crates/rw-query/src/lib.rs', text)

          text = read('crates/rw-server/src/lib.rs')
          module = 'pub mod observations;\n'
          if module not in text:
              anchor = 'pub mod metrics;\n'
              if anchor not in text:
                  raise SystemExit('rw-server module anchor disappeared')
              text = text.replace(anchor, anchor + module, 1)
              write('crates/rw-server/src/lib.rs', text)

          text = read('crates/rw-server/src/routes.rs')
          old_request = 'struct RequestId(Uuid);'
          new_request = 'pub(crate) struct RequestId(pub(crate) Uuid);'
          if new_request not in text:
              if old_request not in text:
                  raise SystemExit('RequestId anchor disappeared')
              text = text.replace(old_request, new_request, 1)
          # The route merge hunks normally apply with fuzz. Preserve the newer
          # latest-run and profile-cycle routes and add only the observation routers.
          read_merge = '        .merge(crate::observations::read_router())\n'
          if read_merge not in text:
              anchor = '        .route("/v1/analytics/spatial-series", post(spatial_series))\n'
              if anchor not in text:
                  raise SystemExit('operational route anchor disappeared')
              text = text.replace(anchor, anchor + read_merge, 1)
          write_merge = '        .merge(crate::observations::write_router())\n'
          if write_merge not in text:
              anchor = '    let protected = Router::new()\n        .merge(operational)\n'
              if anchor not in text:
                  raise SystemExit('protected router anchor disappeared')
              text = text.replace(anchor, anchor + write_merge, 1)
          write('crates/rw-server/src/routes.rs', text)

          for reject in rejects:
              reject.unlink()

          for required in (
              'crates/rw-observations/src/lib.rs',
              'crates/rw-server/src/observations.rs',
              'docs/RW-SERVER-OBSERVATIONS.md',
          ):
              if not (root / required).is_file():
                  raise SystemExit(f'missing ported file: {required}')
          PY

          test -z "$(find . \( -name '*.rej' -o -name '*.orig' \) -print)"
          git diff --check

      - name: Format, compile, test, and lint
        run: |
          set -euo pipefail
          cargo +1.92.0 fmt --all
          cargo +1.92.0 check -p rw-observations -p rw-query -p rw-server --all-targets
          cargo +1.92.0 check --locked -p rw-observations -p rw-query -p rw-server --all-targets
          cargo +1.92.0 test --locked -p rw-observations
          cargo +1.92.0 test --locked -p rw-query
          cargo +1.92.0 test --locked -p rw-server --lib
          cargo +1.92.0 clippy --locked \
            -p rw-observations -p rw-query -p rw-server \
            --all-targets --no-deps -- -D warnings

      - name: Commit ordinary source and remove bootstrap workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/port-observations-cf0ca369.yml
          rm -f .github/workflows/port-observations-cf0ca369-v2.yml
          git add -A
          git diff --cached --check
          test ! -e .github/bootstrap
          test -f crates/rw-observations/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: port unified observations onto cf0ca369"
          git push origin HEAD:feat/rw-server-observations-satellite-final
