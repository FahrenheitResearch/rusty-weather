name: Port observations onto cf0ca369 v4

on:
  pull_request:
    branches: [codex/windows-fetch-lock-fix-20260814]
    paths:
      - '.github/workflows/port-observations-cf0ca369-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-observations-cf0ca369-v4
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  port-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: feat/rw-server-observations-satellite-final
          fetch-depth: 0
          persist-credentials: true

      - name: Verify base and install Rust
        run: |
          set -euo pipefail
          test "$(git merge-base cf0ca3693650153ff0f79a0e60c3ec2da7d0af01 HEAD)" = cf0ca3693650153ff0f79a0e60c3ec2da7d0af01
          test "$(git rev-parse origin/codex/windows-fetch-lock-fix-20260814)" = cf0ca3693650153ff0f79a0e60c3ec2da7d0af01
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgl1-mesa-dev libwayland-dev libx11-dev libxi-dev libxkbcommon-dev
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Recover and partially apply observations implementation
        shell: bash {0}
        run: |
          set -u
          : > "$RUNNER_TEMP/observations.patch.b64"
          for part in $(seq -w 0 10); do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/FahrenheitResearch/rusty-weather/feat/unified-observations-rw-server/.github/bootstrap/unified-observations.patch.part-${part}" \
              >> "$RUNNER_TEMP/observations.patch.b64" || exit 1
          done
          base64 --decode "$RUNNER_TEMP/observations.patch.b64" \
            | gzip --decompress > "$RUNNER_TEMP/observations.patch" || exit 1
          git apply --reject --whitespace=fix "$RUNNER_TEMP/observations.patch"
          echo "partial apply status=$?"
          exit 0

      - name: Resolve integration seams and remove apply artifacts
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/resolve.py" <<'PY'
          from pathlib import Path

          root = Path.cwd()
          rejects = {p.relative_to(root) for p in root.rglob('*.rej')}
          allowed = {
              Path('Cargo.toml.rej'),
              Path('crates/rw-query/src/lib.rs.rej'),
              Path('crates/rw-server/src/lib.rs.rej'),
              Path('crates/rw-server/src/routes.rs.rej'),
          }
          if rejects - allowed:
              raise RuntimeError(f'unexpected rejects: {sorted(map(str, rejects - allowed))}')

          def edit(path, function):
              target = root / path
              old = target.read_text(encoding='utf-8')
              new = function(old)
              target.write_text(new, encoding='utf-8')

          def add_member(text):
              member = '    "crates/rw-observations",\n'
              if member not in text:
                  anchor = '    "crates/rw-query",\n'
                  if anchor not in text:
                      raise RuntimeError('workspace anchor missing')
                  text = text.replace(anchor, anchor + member, 1)
              return text

          def add_query_exports(text):
              old = 'pub use time::parse_legacy_run_origin_unix;'
              new = (
                  'pub use time::{\n'
                  '    parse_legacy_observation_day_origin_unix, '
                  'parse_legacy_observation_hhmm_slot,\n'
                  '    parse_legacy_run_origin_unix,\n'
                  '};'
              )
              if new not in text:
                  if old not in text:
                      raise RuntimeError('time export anchor missing')
                  text = text.replace(old, new, 1)
              if 'query_profile_cycle_with_cancel' not in text:
                  raise RuntimeError('profile-cycle API missing')
              return text

          def add_server_module(text):
              line = 'pub mod observations;\n'
              if line not in text:
                  anchor = 'pub mod metrics;\n'
                  if anchor not in text:
                      raise RuntimeError('server module anchor missing')
                  text = text.replace(anchor, anchor + line, 1)
              return text

          def add_routes(text):
              text = text.replace(
                  'struct RequestId(Uuid);',
                  'pub(crate) struct RequestId(pub(crate) Uuid);',
                  1,
              )
              read_merge = '        .merge(crate::observations::read_router())\n'
              if read_merge not in text:
                  anchor = '        .route("/v1/analytics/spatial-series", post(spatial_series))\n'
                  if anchor not in text:
                      raise RuntimeError('read-router anchor missing')
                  text = text.replace(anchor, anchor + read_merge, 1)
              write_merge = '        .merge(crate::observations::write_router())\n'
              if write_merge not in text:
                  anchor = '    let protected = Router::new()\n        .merge(operational)\n'
                  if anchor not in text:
                      raise RuntimeError('write-router anchor missing')
                  text = text.replace(anchor, anchor + write_merge, 1)
              for preserved in (
                  '.route("/v1/models/{model}/latest-run", get(latest_run))',
                  '.route("/v1/profile-cycle", post(profile_cycle))',
              ):
                  if preserved not in text:
                      raise RuntimeError(f'lost newer API: {preserved}')
              return text

          edit('Cargo.toml', add_member)
          edit('crates/rw-query/src/lib.rs', add_query_exports)
          edit('crates/rw-server/src/lib.rs', add_server_module)
          edit('crates/rw-server/src/routes.rs', add_routes)

          for artifact in list(root.rglob('*.rej')) + list(root.rglob('*.orig')):
              artifact.unlink()

          required = (
              'crates/rw-observations/src/lib.rs',
              'crates/rw-observations/src/mrms.rs',
              'crates/rw-observations/src/nexrad.rs',
              'crates/rw-observations/src/mosaic.rs',
              'crates/rw-server/src/observations.rs',
              'docs/RW-SERVER-OBSERVATIONS.md',
          )
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise RuntimeError(f'missing source files: {missing}')
          PY
          python3 -u "$RUNNER_TEMP/resolve.py"
          test -z "$(find . \( -name '*.rej' -o -name '*.orig' \) -print)"
          git diff --check

      - name: Format and compile port
        id: compile
        shell: bash {0}
        run: |
          set +e
          cargo +1.92.0 fmt --all
          cargo +1.92.0 check -p rw-observations -p rw-query -p rw-server --all-targets
          status=$?
          echo "$status" > "$RUNNER_TEMP/compile-status"
          exit 0

      - name: Publish normal Rust source and remove all temporary workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/port-observations-cf0ca369.yml
          rm -f .github/workflows/port-observations-cf0ca369-v2.yml
          rm -f .github/workflows/port-observations-cf0ca369-v3.yml
          rm -f .github/workflows/port-observations-cf0ca369-v4.yml
          git add -A
          git diff --cached --check
          test ! -e .github/bootstrap
          test -f crates/rw-observations/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: port unified observations onto cf0ca369"
          git push origin HEAD:feat/rw-server-observations-satellite-final
          exit "$(cat "$RUNNER_TEMP/compile-status")"
