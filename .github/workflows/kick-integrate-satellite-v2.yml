name: Kick satellite v2 integration

on:
  push:
    branches: [feat/rw-server-observations-satellite-final]
    paths:
      - '.github/workflows/kick-integrate-satellite-v2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the integration workflow on this exact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/integrate-satellite-v2-cf0ca369.yml/dispatches \
            --data '{"ref":"feat/rw-server-observations-satellite-final"}'
