name: Codex modernization validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-modernization-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  TARGET_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  prepare:
    name: Regenerate lockfile and format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Install Rust 1.85 with rustfmt
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Regenerate Cargo.lock
        run: cargo +1.85.0 generate-lockfile --verbose

      - name: Format Rust sources
        run: cargo +1.85.0 fmt --all

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock ':(glob)**/*.rs'; then
            echo "Cargo.lock and formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git add -u -- ':(glob)**/*.rs'
          git commit -m "chore: refresh lockfile and format"
          git push origin "HEAD:${TARGET_REF}"

  validate:
    name: Check ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out prepared branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Install Rust 1.85 with rustfmt
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt
          rustup default 1.85.0

      - name: Verify formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Check full workspace and all targets
        run: cargo +1.85.0 check --locked --workspace --all-targets

      - name: Run workspace library and integration tests
        if: runner.os == 'Linux'
        run: cargo +1.85.0 test --locked --workspace --lib --tests
