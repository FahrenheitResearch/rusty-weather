name: Bootstrap unified observations implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/bootstrap/unified-observations.patch.part-*'
      - '.github/workflows/bootstrap-unified-observations.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-unified-observations-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  apply-build-test-commit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/unified-observations-rw-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Install Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Apply the implementation patch
        run: |
          set -euo pipefail
          cat .github/bootstrap/unified-observations.patch.part-* \
            | base64 --decode \
            | gzip --decompress > "$RUNNER_TEMP/unified-observations.patch"
          git apply --check "$RUNNER_TEMP/unified-observations.patch"
          git apply "$RUNNER_TEMP/unified-observations.patch"

      - name: Format and validate the implementation
        run: |
          set -euo pipefail
          cargo +1.92.0 fmt --all
          cargo +1.92.0 check -p rw-observations -p rw-query -p rw-server --all-targets
          cargo +1.92.0 test -p rw-observations
          cargo +1.92.0 test -p rw-query
          cargo +1.92.0 test -p rw-server --lib
          cargo +1.92.0 clippy -p rw-observations -p rw-query -p rw-server --all-targets --no-deps -- -D warnings

      - name: Commit the validated implementation
        run: |
          set -euo pipefail
          rm -f .github/bootstrap/unified-observations.patch.part-*
          rm -f .github/workflows/bootstrap-unified-observations.yml
          rmdir .github/bootstrap 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add unified satellite and radar delivery"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
