name: Port observations onto cf0ca369

on:
  pull_request:
    branches: [codex/windows-fetch-lock-fix-20260814]
    paths:
      - '.github/workflows/port-observations-cf0ca369.yml'
  push:
    branches: [feat/rw-server-observations-satellite-final]
    paths:
      - '.github/workflows/port-observations-cf0ca369.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: port-observations-cf0ca369
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  port-build-test-commit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: feat/rw-server-observations-satellite-final
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the requested base is preserved
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cf0ca3693650153ff0f79a0e60c3ec2da7d0af01 HEAD
          test "$(git merge-base cf0ca3693650153ff0f79a0e60c3ec2da7d0af01 HEAD)" = cf0ca3693650153ff0f79a0e60c3ec2da7d0af01

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Install Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Recover and port the observations implementation
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/observations.patch.b64"
          for part in $(seq -w 0 10); do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/FahrenheitResearch/rusty-weather/feat/unified-observations-rw-server/.github/bootstrap/unified-observations.patch.part-${part}" \
              >> "$RUNNER_TEMP/observations.patch.b64"
          done
          base64 --decode "$RUNNER_TEMP/observations.patch.b64" \
            | gzip --decompress > "$RUNNER_TEMP/observations.patch"

          # Apply every clean hunk from the older implementation, then port the
          # four integration seams whose newer APIs intentionally changed.
          git apply --reject --whitespace=fix "$RUNNER_TEMP/observations.patch" || true

          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          expected_rejects = {
              Path('Cargo.toml.rej'),
              Path('crates/rw-query/src/lib.rs.rej'),
              Path('crates/rw-server/src/lib.rs.rej'),
              Path('crates/rw-server/src/routes.rs.rej'),
          }
          rejects = set(root.rglob('*.rej'))
          unexpected = rejects - expected_rejects
          if unexpected:
              raise SystemExit(f'unexpected rejected hunks: {sorted(map(str, unexpected))}')

          def rewrite(path: str, transform):
              target = root / path
              text = target.read_text(encoding='utf-8')
              updated = transform(text)
              if updated == text:
                  return
              target.write_text(updated, encoding='utf-8')

          def workspace(text: str) -> str:
              entry = '    "crates/rw-observations",\n'
              if entry not in text:
                  marker = '    "crates/rw-query",\n'
                  if marker not in text:
                      raise SystemExit('workspace rw-query member anchor missing')
                  text = text.replace(marker, marker + entry, 1)
              return text

          def query_lib(text: str) -> str:
              replacement = (
                  'pub use time::{\n'
                  '    parse_legacy_observation_day_origin_unix, '
                  'parse_legacy_observation_hhmm_slot,\n'
                  '    parse_legacy_run_origin_unix,\n'
                  '};'
              )
              old = 'pub use time::parse_legacy_run_origin_unix;'
              if replacement not in text:
                  if old not in text:
                      raise SystemExit('rw-query time export anchor missing')
                  text = text.replace(old, replacement, 1)
              return text

          def server_lib(text: str) -> str:
              line = 'pub mod observations;\n'
              if line not in text:
                  for marker in ('pub mod metrics;\n', 'pub mod jobs;\n'):
                      if marker in text:
                          return text.replace(marker, marker + line, 1)
                  raise SystemExit('rw-server module anchor missing')
              return text

          def routes(text: str) -> str:
              text = text.replace(
                  'struct RequestId(Uuid);',
                  'pub(crate) struct RequestId(pub(crate) Uuid);',
                  1,
              )
              read_line = '        .merge(crate::observations::read_router())\n'
              if read_line not in text:
                  marker = (
                      '        .route("/v1/analytics/spatial-series", post(spatial_series))\n'
                      '        .route_layer('
                  )
                  if marker not in text:
                      raise SystemExit('operational route anchor missing')
                  text = text.replace(
                      marker,
                      '        .route("/v1/analytics/spatial-series", post(spatial_series))\n'
                      + read_line
                      + '        .route_layer(',
                      1,
                  )
              write_line = '        .merge(crate::observations::write_router())\n'
              if write_line not in text:
                  marker = '    let protected = Router::new()\n        .merge(operational)\n'
                  if marker not in text:
                      raise SystemExit('protected router anchor missing')
                  text = text.replace(marker, marker + write_line, 1)
              return text

          rewrite('Cargo.toml', workspace)
          rewrite('crates/rw-query/src/lib.rs', query_lib)
          rewrite('crates/rw-server/src/lib.rs', server_lib)
          rewrite('crates/rw-server/src/routes.rs', routes)

          for reject in rejects:
              reject.unlink()

          required = [
              root / 'crates/rw-observations/src/lib.rs',
              root / 'crates/rw-server/src/observations.rs',
              root / 'docs/RW-SERVER-OBSERVATIONS.md',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing ported implementation files: {missing}')
          PY

          test -z "$(find . -name '*.rej' -o -name '*.orig')"
          git diff --check

      - name: Format and validate the port
        run: |
          set -euo pipefail
          cargo +1.92.0 fmt --all
          # First invocation is intentionally unlocked so Cargo can register
          # the new workspace package; every subsequent gate is locked.
          cargo +1.92.0 check \
            -p rw-observations -p rw-query -p rw-server --all-targets
          cargo +1.92.0 check --locked \
            -p rw-observations -p rw-query -p rw-server --all-targets
          cargo +1.92.0 test --locked -p rw-observations
          cargo +1.92.0 test --locked -p rw-query
          cargo +1.92.0 test --locked -p rw-server --lib
          cargo +1.92.0 clippy --locked \
            -p rw-observations -p rw-query -p rw-server \
            --all-targets --no-deps -- -D warnings

      - name: Publish normal reviewed Rust source
        run: |
          set -euo pipefail
          rm -f .github/workflows/port-observations-cf0ca369.yml
          git add -A
          git diff --cached --check
          test ! -e .github/bootstrap
          test -f crates/rw-observations/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: port unified observations onto cf0ca369"
          git push origin HEAD:feat/rw-server-observations-satellite-final
