name: Export exact cf0ca369 base

on:
  push:
    branches:
      - feat/final-observations-satellite-v2-cf0ca369
    paths:
      - .github/workflows/export-correct-base.yml
  pull_request:
    branches:
      - codex/windows-fetch-lock-fix-20260814
    paths:
      - .github/workflows/export-correct-base.yml

permissions:
  contents: read

concurrency:
  group: export-correct-base
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: cf0ca3693650153ff0f79a0e60c3ec2da7d0af01
          fetch-depth: 1
      - run: tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/rusty-weather-cf0ca369.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rusty-weather-cf0ca369
          path: ${{ runner.temp }}/rusty-weather-cf0ca369.tar.gz
          if-no-files-found: error
          retention-days: 1
