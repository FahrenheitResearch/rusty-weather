name: Port observations onto cf0ca369

on:
  push:
    branches:
      - feat/final-observations-satellite-v2-cf0ca369
    paths:
      - .github/workflows/port-observations-onto-cf0ca369.yml
  pull_request:
    branches:
      - codex/windows-fetch-lock-fix-20260814
    paths:
      - .github/workflows/port-observations-onto-cf0ca369.yml

permissions:
  contents: write

concurrency:
  group: port-observations-cf0ca369
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  port-build-test-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'feat/final-observations-satellite-v2-cf0ca369'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the correct-base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: feat/final-observations-satellite-v2-cf0ca369
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact base
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cf0ca3693650153ff0f79a0e60c3ec2da7d0af01 HEAD

      - name: Reconstruct and merge the reviewed observations patch
        run: |
          set -euo pipefail
          git fetch origin feat/unified-observations-rw-server
          : > "$RUNNER_TEMP/observations.patch.b64"
          for part in $(seq -w 0 10); do
            git show "origin/feat/unified-observations-rw-server:.github/bootstrap/unified-observations.patch.part-${part}" \
              >> "$RUNNER_TEMP/observations.patch.b64"
          done
          base64 --decode "$RUNNER_TEMP/observations.patch.b64" \
            | gzip --decompress > "$RUNNER_TEMP/observations.patch"

          git apply --index --whitespace=nowarn \
            --exclude=Cargo.toml \
            --exclude=crates/rw-query/src/lib.rs \
            --exclude=crates/rw-server/src/lib.rs \
            --exclude=crates/rw-server/src/routes.rs \
            "$RUNNER_TEMP/observations.patch"

          python3 - "$RUNNER_TEMP/observations.patch" "$RUNNER_TEMP/conflicts" <<'PY'
          from pathlib import Path
          import sys

          patch = Path(sys.argv[1]).read_text()
          out = Path(sys.argv[2])
          out.mkdir(parents=True, exist_ok=True)
          wanted = {
              "Cargo.toml",
              "crates/rw-query/src/lib.rs",
              "crates/rw-server/src/lib.rs",
              "crates/rw-server/src/routes.rs",
          }
          sections = patch.split("diff --git ")
          for section in sections[1:]:
              first = section.splitlines()[0]
              left = first.split(" b/", 1)[0]
              path = left.removeprefix("a/")
              if path in wanted:
                  (out / (path.replace("/", "__") + ".patch")).write_text("diff --git " + section)
          missing = [path for path in wanted if not (out / (path.replace("/", "__") + ".patch")).exists()]
          if missing:
              raise SystemExit(f"missing conflict sections: {missing}")
          PY

          failed=0
          for conflict in "$RUNNER_TEMP"/conflicts/*.patch; do
            echo "Applying conflict section: $conflict"
            patch --batch --forward --fuzz=3 -p1 < "$conflict" || failed=1
          done
          git add Cargo.toml crates/rw-query/src/lib.rs crates/rw-server/src/lib.rs crates/rw-server/src/routes.rs
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi
          test "$failed" -eq 0
          git diff --cached --check

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Install Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Format and validate the observations port
        run: |
          set -euo pipefail
          cargo +1.92.0 fmt --all
          cargo +1.92.0 check --locked -p rw-observations -p rw-query -p rw-server --all-targets
          cargo +1.92.0 test --locked -p rw-observations
          cargo +1.92.0 test --locked -p rw-query
          cargo +1.92.0 test --locked -p rw-server --lib
          cargo +1.92.0 clippy --locked \
            -p rw-observations -p rw-query -p rw-server \
            --all-targets --no-deps -- -D warnings

      - name: Publish normal reviewed Rust source
        run: |
          set -euo pipefail
          rm -f .github/workflows/port-observations-onto-cf0ca369.yml
          find . -name '*.orig' -delete
          git add -A
          git diff --cached --check
          test -f crates/rw-observations/src/lib.rs
          test ! -e .github/bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: port unified observations onto cf0ca369"
          git push origin HEAD:feat/final-observations-satellite-v2-cf0ca369
