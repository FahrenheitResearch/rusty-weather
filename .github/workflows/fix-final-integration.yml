name: Diagnose final server integration

on:
  pull_request:
    branches: [codex/windows-fetch-lock-fix-20260814]
    paths:
      - '.github/workflows/fix-final-integration.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-final-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  representative-server-route:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/rw-server-observations-satellite-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out final source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: feat/rw-server-observations-satellite-final
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgl1-mesa-dev libwayland-dev libx11-dev libxi-dev libxkbcommon-dev

      - name: Install Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt

      - name: Apply the pending normal-source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          follow = Path('crates/rw-sat/src/follow.rs')
          text = follow.read_text()
          call = 'archive_goes_source(store_root, &download.path, &field.scene, &object.key)'
          head, tail = text.split(call, 1)
          follow.write_text(head + call + tail.replace(
              '.map_err(to_send_sync)?;',
              '.map_err(|error| other(error.to_string()))?;',
              1,
          ))

          archive = Path('crates/rw-sat/src/archive.rs')
          text = archive.read_text().replace(
              'use chrono::{DateTime, TimeZone, Utc};',
              'use chrono::{DateTime, Utc};\n#[cfg(test)]\nuse chrono::TimeZone;',
              1,
          )
          archive.write_text(text)

          sat_worker = Path('crates/rusty-weather-ui/src/sat_worker.rs')
          text = sat_worker.read_text()
          text = text.replace('    let anchors = band_anchors(band);\n', '', 1)
          text = text.replace(
              'assert_eq!(options.len(), 16 + GoesAbiRgbCompositeStyle::ALL.len());',
              'assert_eq!(options.len(), product_catalog(true).len());',
              1,
          )
          sat_worker.write_text(text)

          store = Path('crates/rw-observations/src/store.rs')
          store.write_text(store.read_text().replace(
              'use chrono::{DateTime, Datelike, Timelike, Utc};',
              'use chrono::{DateTime, Datelike, Utc};',
              1,
          ))
          PY
          cargo +1.92.0 fmt --all

      - name: Run one previously failing route test alone
        run: |
          cargo +1.92.0 test --locked -p rw-server \
            routes::tests::health_is_public_but_data_routes_require_a_token \
            -- --nocapture --test-threads=1
