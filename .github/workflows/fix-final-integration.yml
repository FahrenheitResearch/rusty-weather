name: Fix final integration on radar-app base

on:
  pull_request:
    branches: [codex/windows-fetch-lock-fix-20260814]
    paths:
      - '.github/workflows/fix-final-integration.yml'

permissions:
  contents: write

concurrency:
  group: fix-final-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fix-build-test-commit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/rw-server-observations-satellite-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out final source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          ref: feat/rw-server-observations-satellite-final
          fetch-depth: 0
          persist-credentials: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Install Rust 1.92
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Apply integration fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          follow = Path('crates/rw-sat/src/follow.rs')
          text = follow.read_text()
          call = 'archive_goes_source(store_root, &download.path, &field.scene, &object.key)'
          if call not in text:
              raise SystemExit('expected archive_goes_source call was not found')
          head, tail = text.split(call, 1)
          old = '.map_err(to_send_sync)?;'
          new = '.map_err(|error| other(error.to_string()))?;'
          if old not in tail:
              raise SystemExit('expected archive_goes_source error mapping was not found')
          follow.write_text(head + call + tail.replace(old, new, 1))

          archive = Path('crates/rw-sat/src/archive.rs')
          text = archive.read_text()
          old = 'use chrono::{DateTime, TimeZone, Utc};'
          new = 'use chrono::{DateTime, Utc};'
          if old not in text:
              raise SystemExit('expected archive chrono import was not found')
          archive.write_text(text.replace(old, new, 1))
          PY

      - name: Format and compile the complete workspace
        run: |
          cargo +1.92.0 fmt --all
          cargo +1.92.0 check --locked --workspace --all-targets

      - name: Run focused tests and clippy
        run: |
          cargo +1.92.0 test --locked -p rw-sat
          cargo +1.92.0 test --locked -p rw-observations
          cargo +1.92.0 test --locked -p rw-server --lib
          cargo +1.92.0 clippy --locked \
            -p rw-sat -p rw-observations -p rw-server \
            --all-targets --no-deps -- -D warnings

      - name: Commit ordinary source and remove this repair workflow
        run: |
          rm -f .github/workflows/fix-final-integration.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: compile unified satellite and observation integration"
          git push origin HEAD:feat/rw-server-observations-satellite-final
