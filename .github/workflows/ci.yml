name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Install Rust 1.92 with rustfmt and Clippy
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          cargo +1.92.0 fmt --all -- --check
          cargo +1.92.0 fmt \
            --manifest-path deploy/distributed-lab/labctl/Cargo.toml -- --check

      - name: Verify deployment configuration
        if: runner.os == 'Linux'
        env:
          RW_BUILD_SHA: 0000000000000000000000000000000000000000
        run: |
          bash -n deploy/docker/docker-entrypoint.sh
          bash -n deploy/docker/smoke-production-candidate.sh
          bash -n deploy/distributed-lab/run.sh
          mkdir -p "$RUNNER_TEMP/systemd/rusty-weather.service.d"
          cp deploy/systemd/rusty-weather.service \
            "$RUNNER_TEMP/systemd/rusty-weather.service"
          cp deploy/systemd/rusty-weather-generation-replication.conf \
            "$RUNNER_TEMP/systemd/rusty-weather.service.d/50-generation-replication.conf"
          systemd-analyze verify "$RUNNER_TEMP/systemd/rusty-weather.service"
          docker compose -f deploy/docker/compose.yaml config --quiet
          docker compose -f deploy/docker/compose.yaml \
            -f deploy/docker/compose.replication.yaml config --quiet
          docker compose -f deploy/distributed-lab/compose.yaml config --quiet

      - name: Check full workspace and all targets
        run: cargo +1.92.0 check --locked --workspace --all-targets

      - name: Check the isolated distributed lab controller
        if: runner.os == 'Linux'
        run: cargo +1.92.0 check --locked \
          --manifest-path deploy/distributed-lab/labctl/Cargo.toml --all-targets

      - name: Deny warnings in distributed service code
        if: runner.os == 'Linux'
        run: |
          cargo +1.92.0 clippy --locked \
            -p rw-community-protocol \
            -p rw-community-relay \
            -p rw-federation-proxy \
            -p rw-generation-replication \
            -p rw-server \
            -p rw-scheduler \
            --all-targets --no-deps -- -D warnings

      - name: Run workspace library and integration tests
        if: runner.os == 'Linux'
        run: cargo +1.92.0 test --locked --workspace --lib --tests

      - name: Test the isolated distributed lab controller
        if: runner.os == 'Linux'
        run: cargo +1.92.0 test --locked \
          --manifest-path deploy/distributed-lab/labctl/Cargo.toml --all-targets

  dependency-policy:
    name: Dependency policy - ${{ matrix.package.name }} - ${{ matrix.checks }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: desktop
            manifest: crates/rusty-weather-ui/Cargo.toml
          - name: packaged-tools
            manifest: crates/rusty-weather/Cargo.toml
          - name: server
            manifest: crates/rw-server/Cargo.toml
          - name: scheduler
            manifest: crates/rw-scheduler/Cargo.toml
          - name: distributed-lab
            manifest: deploy/distributed-lab/labctl/Cargo.toml
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Check Cargo dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.92.0"
          command: check ${{ matrix.checks }}
          manifest-path: ${{ matrix.package.manifest }}
          arguments: --all-features --locked

  r2-hot-gateway:
    name: R2 immutable gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: deploy/cloudflare-r2-gateway/package-lock.json

      - name: Test and dry-run the R2 gateway
        working-directory: deploy/cloudflare-r2-gateway
        run: |
          npm ci
          npm run audit
          npm run check
          npm run licenses
          git diff --exit-code -- THIRD_PARTY_LICENSES-node.md
          npm run sbom
          test -s rusty-weather-r2-gateway.cdx.json
          npm exec -- wrangler deploy --dry-run --outdir "$RUNNER_TEMP/r2-gateway"
          test -s "$RUNNER_TEMP/r2-gateway/index.js"

  distributed-lab:
    name: Isolated distributed protocol lab
    needs: [validate, dependency-policy, r2-hot-gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Run the isolated multi-node lab
        run: bash deploy/distributed-lab/run.sh

      - name: Preserve protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rusty-weather-distributed-lab-evidence
          path: deploy/distributed-lab/runtime/results/
          if-no-files-found: warn
          retention-days: 14

  production-candidate-image:
    name: Unmodified production image smoke
    needs: [validate, dependency-policy, r2-hot-gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false

      - name: Build and smoke the hardened production image
        env:
          RW_BUILD_SHA: ${{ github.sha }}
          RW_CANDIDATE_IMAGE: rusty-weather:ci-${{ github.sha }}
        run: bash deploy/docker/smoke-production-candidate.sh
