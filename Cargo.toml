[workspace]
members = [
    "crates/rw-community-protocol",
    "crates/rw-glm",
    "crates/rw-gdex",
    "crates/rw-formula",
    "crates/rw-ingest",
    "crates/rw-query",
    "crates/rw-server",
    "crates/rw-scheduler",
    "crates/rw-sat",
    "crates/rw-sat-check",
    "crates/rw-store",
    "crates/rw-ui",
    "crates/rustwx-calc",
    "crates/rustwx-contour",
    "crates/rustwx-core",
    "crates/rustwx-io",
    "crates/rustwx-models",
    "crates/rustwx-products",
    "crates/rustwx-regrid",
    "crates/rustwx-render",
    "crates/rustwx-sounding",
    "crates/rusty-weather",
    "crates/rusty-weather-ui",
    "vendor/netcrust",
    "vendor/wrf-rust/crates/wrf-core",
    "vendor/wrf-rust/crates/wrf-formula",
]
exclude = [
    "vendor/ecape-rs",
    "vendor/grib-core",
    "vendor/metrust",
    "vendor/netcrust/vendor/hdf5-reader",
    "vendor/sharprs",
    "vendor/wx-core",
    "vendor/wx-field",
    "vendor/wx-radar",
    "vendor/wx-math",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.92"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

# netcrust must resolve `hdf5-reader = "0.3"` to the vendored, production-
# tested tree (vendor/netcrust/vendor/hdf5-reader), not the crates.io
# package. Patches only apply from the workspace root, so the pin lives here.
[patch.crates-io]
hdf5-reader = { path = "vendor/netcrust/vendor/hdf5-reader" }

# The WRF ECAPE golden corpus is pinned to ecape-rs 8292253. Keep that
# algorithm revision while resolving its meteorology support crates to this
# audited workspace tree, avoiding the pinned repository's unused default
# network/TLS feature graph.
[patch."https://github.com/FahrenheitResearch/metrust-py.git"]
metrust = { path = "vendor/metrust" }
wx-math = { path = "vendor/wx-math" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = 1
