[package]
name = "rw-climo-pack"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone on purpose: this tool is scp'd to and built on the data nodes
# (no workspace, no path deps), so it must carry its own dependency pins.
[workspace]

[[bin]]
name = "rw_climo_pack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
miniz_oxide = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
